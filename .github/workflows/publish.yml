# Publishes to npm through trusted publishing (GitHub OIDC): no npm token is stored anywhere.
# The trusted publisher on npmjs.com is bound to this file name, so keep it as publish.yml.
# Release: bump "version" in package.json, merge to main, then push a tag v<version>.
name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Tag matches package.json version
        run: |
          pkg="v$(node -p 'require("./package.json").version')"
          [ "$pkg" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != package.json $pkg"; exit 1; }
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm publish --access public
